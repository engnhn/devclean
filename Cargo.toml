[package]
name = "devclean"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A cross-platform CLI for finding and explicitly cleaning reclaimable development artifacts"
license = "MIT"
keywords = ["cli", "cleanup", "disk", "developer", "filesystem"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"
